schema_version: "1.0"
name: 01-small-task-plan-ordering
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  model: sonnet
  max_turns: 30
  timeout_seconds: 700
  allowed_tools: [Skill, Agent, Write, Read, Glob, Grep]
  prompt: |
    Run babysit on this task.

    This is the working copy of a small React app. The project profile is at `.claude/babysit.md` and the code is on disk — read whatever you need.

    The task: rename the hook `useProductFilters` to `useCatalogFilters` — file and symbol — update every call site, and add a new `sortOrder` parameter that all call sites pass through.

    Use the feature slug `catalog-filters-rename`.

    Every product decision is already settled by me, the owner: `sortOrder` accepts only `'rating' | 'price' | 'recent'`, defaults to `'rating'`, and an unknown value falls back to the default silently. Do not ask me clarifying questions — write the kit.

    Stop at the sign-off checkpoint: show me the kit and wait. Do not dispatch the manager, do not start phase 2, and do not create git branches.
